name: Build Quran Player APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.x
          channel: stable

      - name: Generate Android Skeleton & Inject Permissions
        run: |
          # 1. Extract app name from pubspec
          APP_NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          
          # 2. Backup our actual code
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          
          # 3. Remove old android folder to prevent conflicts
          rm -rf android
          
          # 4. Generate fresh Android files in the cloud
          flutter create . --platforms=android --project-name "$APP_NAME" --org com.quranplayer
          
          # 5. Restore our code
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          
          # 6. Inject required permissions (Internet + Overlay for Azkar Pop-up)
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-player-release
          path: build/app/outputs/flutter-apk/app-release.apk
