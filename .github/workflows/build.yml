name: Build Quran Player APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.x
          channel: stable

      - name: Generate Android Skeleton, Fix SDK & Apply Icon
        run: |
          APP_NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          rm -rf android
          flutter create . --platforms=android --project-name "$APP_NAME" --org com.quranplayer
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          
          # Force compileSdk to 35 to satisfy newer plugins (audioplayers, etc.)
          sed -i 's/flutter.compileSdkVersion/35/g' android/app/build.gradle
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          
          # MAGIC: Replace default blue icon with your custom icon.png
          if [ -f "icon.png" ]; then
            cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "✅ Custom icon applied!"
          else
            echo "⚠️ No icon.png found. Using default."
          fi

      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-player-release
          path: build/app/outputs/flutter-apk/app-release.apk
